name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - SgfDevs/**
      - SgfDevs.Tests/**
      - SgfDevs.slnx
      - .github/workflows/**

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.changed-files.outputs.application_any_changed }}
      workflows: ${{ steps.changed-files.outputs.workflows_any_changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect relevant changes
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            application:
              - SgfDevs/**
              - SgfDevs.Tests/**
              - SgfDevs.slnx
              - .github/workflows/ci.yml
            workflows:
              - .github/workflows/**

  build-and-test:
    needs: changes
    if: ${{ needs.changes.outputs.application == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SgfDevs.slnx

      - name: Build
        run: dotnet build SgfDevs.slnx --no-restore --verbosity minimal

      - name: Test
        run: dotnet test SgfDevs.slnx --no-build --verbosity minimal

  actionlint:
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  result:
    name: CI checks
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - changes
      - build-and-test
      - actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: build-and-test, actionlint
          jobs: ${{ toJSON(needs) }}
