name: Release

on:
  push:
    branches: [main]
    paths:
      - 'SgfDevs/**'
      - 'Dockerfile'
      - '.github/workflows/**'
      - '.releaserc.json'

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      release-version: ${{ steps.semantic.outputs.release-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - run: npm install -g semantic-release conventional-changelog-conventionalcommits @semantic-release/exec

      - name: Create Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  docker:
    needs: release
    if: ${{ needs.release.outputs.new-release-published == 'true' }}
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.release-version }}
    secrets: inherit

  promote-staging:
    needs:
      - release
      - docker
    if: ${{ needs.release.outputs.new-release-published == 'true' }}
    uses: glitchedmob/infra-gha/.github/workflows/kustomize-image-pr.yml@v0.8.1
    with:
      deployment-repository: sgfdevs/infra-k8s-apps
      kustomization-path: src/k8s/apps/sgf.dev/staging
      image: ghcr.io/sgfdevs/sgf.dev
      image-tag: ${{ needs.release.outputs.release-version }}
      source-ref: v${{ needs.release.outputs.release-version }}
      promotion-id: staging
      auto-merge: true
      github-app-id: "4527359"
    secrets:
      github-app-private-key: ${{ secrets.INFRA_AUTOMATION_APP_PRIVATE_KEY }}

  promote-production:
    needs:
      - release
      - docker
      - promote-staging
    if: ${{ needs.release.outputs.new-release-published == 'true' }}
    uses: glitchedmob/infra-gha/.github/workflows/kustomize-image-pr.yml@v0.8.1
    with:
      deployment-repository: sgfdevs/infra-k8s-apps
      kustomization-path: src/k8s/apps/sgf.dev/production
      image: ghcr.io/sgfdevs/sgf.dev
      image-tag: ${{ needs.release.outputs.release-version }}
      source-ref: v${{ needs.release.outputs.release-version }}
      promotion-id: production
      github-app-id: "4527359"
    secrets:
      github-app-private-key: ${{ secrets.INFRA_AUTOMATION_APP_PRIVATE_KEY }}
