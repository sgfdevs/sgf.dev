name: sgf-dev-local

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: sgf-dev-local
      AWS_SECRET_ACCESS_KEY: sgf-dev-local-password
      S3_BUCKET: sgf-dev-local
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data

volumes:
  seaweedfs-data:
